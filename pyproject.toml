[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betiq"
version = "0.1.0"
description = "Agent de pronostics sportifs et esport : statistiques, detection de valeur et gestion de bankroll"
readme = "betiq/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Rien n'est necessaire : les cotes en direct utilisent urllib (stdlib).
dev = ["ruff>=0.5"]

[project.scripts]
betiq = "betiq.cli:main"

[tool.setuptools]
packages = ["betiq", "betiq.ratings", "betiq.markets", "betiq.providers"]

[tool.setuptools.package-data]
betiq = ["../data/demo/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"
